name: ci

on:
  push:
  pull_request:

jobs:
  mcp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/nx-codex/mcp/package-lock.json
      - working-directory: plugins/nx-codex/mcp
        run: npm ci
      - working-directory: plugins/nx-codex/mcp
        run: npm run verify

